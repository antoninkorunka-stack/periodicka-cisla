<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Periodická čísla – procvičování</title>
<style>
:root {
  --bg:#f4f6fa; --card:#fff; --text:#172033; --muted:#687386; --line:#dce3ed;
  --blue:#2563eb; --green:#147d3f; --greenbg:#edfdf3; --red:#b42318; --redbg:#fff1f1;
  --info:#eff6ff;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  display:flex;justify-content:center;padding:22px 14px;
}
.wrap{width:min(760px,100%)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}
.stat strong{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--muted)}
.card{
  background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;
  box-shadow:0 14px 36px rgba(15,23,42,.07)
}
h1{margin:0 0 5px;font-size:30px}
.sub{margin:0 0 22px;color:var(--muted)}
.progress{height:8px;background:#e8edf4;border-radius:999px;overflow:hidden;margin-bottom:26px}
.progress>div{height:100%;background:var(--blue);width:0;transition:.2s}
.task{text-align:center;color:var(--muted);font-size:15px}
.problem{text-align:center;font-weight:800;font-size:58px;margin:12px 0 24px}
.period{text-decoration:overline;text-decoration-thickness:2px}
.answer-area{display:flex;align-items:center;justify-content:center;margin:8px 0 6px}
.equals{font-size:34px;font-weight:700;margin-right:14px}
.frac{display:grid;grid-template-rows:auto 2px auto;width:160px;gap:7px}
.frac-line{height:2px;background:var(--text);width:100%}
.frac input{
  width:100%;padding:10px 8px;text-align:center;border:2px solid var(--line);
  border-radius:10px;font-size:21px;outline:none;background:#fff
}
.frac input:focus{border-color:var(--blue)}
.check-wrap{text-align:center;margin-top:18px}
button{border:0;border-radius:12px;padding:13px 18px;font:inherit;font-weight:750;cursor:pointer}
.primary{background:var(--blue);color:#fff}
.secondary{background:#eef2ff;color:#24439a}
button:disabled{opacity:.55;cursor:not-allowed}
.note{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.feedback{display:none;margin-top:20px;padding:18px;border-radius:14px;line-height:1.55}
.feedback.good{display:block;background:var(--greenbg);border:1px solid #bceccb;color:var(--green)}
.feedback.bad{display:block;background:var(--redbg);border:1px solid #ffc7c2;color:var(--red)}
.feedback.info{display:block;background:var(--info);border:1px solid #cbdcff;color:#243d78}
.steps{color:var(--text);margin-top:11px}
.steps div{margin:7px 0}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.result{display:none;text-align:center;padding:10px 0 4px}
.result.show{display:block}
.score{font-size:54px;font-weight:900;margin:10px 0}
.small{font-size:13px;color:var(--muted);margin-top:18px;text-align:center}
@media(max-width:560px){
  .card{padding:20px}
  .problem{font-size:46px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="stats">
    <div class="stat"><strong id="qnum">1/10</strong><span>Příklad</span></div>
    <div class="stat"><strong id="okCount">0</strong><span>Správně</span></div>
    <div class="stat"><strong id="badCount">0</strong><span>Špatně</span></div>
  </div>

  <main class="card">
    <h1>Periodická čísla → zlomky</h1>
    <p class="sub">10 náhodných příkladů z banky 1000 různých úloh.</p>
    <div class="progress"><div id="progress"></div></div>

    <section id="quiz">
      <div class="task">Převeď periodické číslo na zlomek:</div>
      <div class="problem" id="problem">0,<span class="period">3</span></div>

      <div class="answer-area">
        <span class="equals">=</span>
        <div class="frac">
          <input id="numInput" type="number" inputmode="numeric" placeholder="čitatel" aria-label="Čitatel">
          <div class="frac-line"></div>
          <input id="denInput" type="number" inputmode="numeric" placeholder="jmenovatel" aria-label="Jmenovatel">
        </div>
      </div>

      <div class="check-wrap">
        <button class="primary" id="checkBtn" type="button">Zkontrolovat</button>
      </div>
      <div class="note">Bez lomítka: čitatel napiš nahoru, jmenovatel dolů.</div>

      <div id="feedback" class="feedback"></div>

      <div class="actions">
        <button class="secondary" id="showBtn" type="button">Ukázat postup</button>
        <button class="secondary" id="nextBtn" type="button">Jiný příklad</button>
      </div>

      <div class="small">V jednom kole se žádný příklad neopakuje.</div>
    </section>

    <section id="result" class="result">
      <h2>Vyhodnocení</h2>
      <div class="score" id="scorePct">0 %</div>
      <p id="scoreText"></p>
      <button class="primary" id="restartBtn" type="button">Nových 10 příkladů</button>
    </section>
  </main>
</div>

const TOTAL = 10;

let round = [];
let q = 0;
let ok = 0;
let bad = 0;
let current = null;
let answered = false;

const $ = id => document.getElementById(id);

function gcd(a,b){
  a=Math.abs(a); b=Math.abs(b);
  while(b!==0){ const t=b; b=a%b; a=t; }
  return a;
}

function reduce(n,d){
  if(d<0){ n=-n; d=-d; }
  const g=gcd(n,d);
  return [n/g,d/g];
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

function newRound(){
  round=shuffle(BANK).slice(0,TOTAL);
  q=0; ok=0; bad=0; answered=false;
  $("quiz").style.display="block";
  $("result").className="result";
  loadQuestion();
}

function loadQuestion(){
  current=round[q];
  answered=false;
  $("problem").innerHTML="0,"+current.non+'<span class="period">'+current.per+"</span>";
  $("numInput").value="";
  $("denInput").value="";
  $("numInput").disabled=false;
  $("denInput").disabled=false;
  $("checkBtn").disabled=false;
  $("feedback").className="feedback";
  $("feedback").innerHTML="";
  updateStats();
  setTimeout(function(){$("numInput").focus();},30);
}

function updateStats(){
  $("qnum").textContent=(q+1)+"/"+TOTAL;
  $("okCount").textContent=ok;
  $("badCount").textContent=bad;
  $("progress").style.width=(q/TOTAL*100)+"%";
}

function readAnswer(){
  const ns=$("numInput").value.trim();
  const ds=$("denInput").value.trim();
  if(ns==="" || ds==="") return null;
  const n=Number(ns), d=Number(ds);
  if(!Number.isFinite(n) || !Number.isFinite(d) || d===0) return null;
  return [n,d];
}

function equivalent(fr){
  const r=reduce(fr[0],fr[1]);
  return r[0]===current.rn && r[1]===current.rd;
}

function decimalText(){
  return "0,"+current.non+current.per+current.per+current.per+"…";
}

function explanation(){
  const m=current.non.length;
  const n=current.per.length;
  let h='<div class="steps">';
  h+='<div><b>1.</b> Označíme číslo: <b>x = '+decimalText()+'</b></div>';

  if(m===0){
    const M=Math.pow(10,n);
    h+='<div><b>2.</b> Perioda má '+n+(n===1?' číslici':' číslice')+', takže násobíme <b>'+M+'</b>.</div>';
    h+='<div><b>3.</b> '+M+'x = '+current.per+','+current.per+current.per+'…</div>';
    h+='<div><b>4.</b> Odečteme x: '+M+'x − x = '+Number(current.per)+'</div>';
    h+='<div><b>5.</b> '+(M-1)+'x = '+current.num+', tedy x = '+current.num+'/'+current.den+'</div>';
  } else {
    const A=Math.pow(10,m);
    const B=Math.pow(10,m+n);
    h+='<div><b>2.</b> Posuneme neperiodickou část: '+A+'x = '+current.non+','+current.per+current.per+'…</div>';
    h+='<div><b>3.</b> Posuneme ještě o délku periody: '+B+'x = '+current.non+current.per+','+current.per+current.per+'…</div>';
    h+='<div><b>4.</b> Odečteme: '+B+'x − '+A+'x = '+current.num+'</div>';
    h+='<div><b>5.</b> '+current.den+'x = '+current.num+', tedy x = '+current.num+'/'+current.den+'</div>';
  }

  if(current.rn!==current.num || current.rd!==current.den){
    h+='<div><b>6.</b> Zkrátíme: <b>'+current.rn+'/'+current.rd+'</b></div>';
  } else {
    h+='<div><b>Výsledek:</b> '+current.rn+'/'+current.rd+'</div>';
  }

  h+='</div>';
  return h;
}

function lockInputs(){
  $("numInput").disabled=true;
  $("denInput").disabled=true;
  $("checkBtn").disabled=true;
}

function check(){
  if(answered) return;

  const fr=readAnswer();
  if(!fr){
    $("feedback").className="feedback info";
    $("feedback").innerHTML="<b>Vyplň čitatele i jmenovatele.</b>";
    return;
  }

  answered=true;
  lockInputs();

  if(equivalent(fr)){
    ok++;
    updateStats();
    $("feedback").className="feedback good";
    $("feedback").innerHTML="<b>Správně! ✅</b><br>Výsledek je "+current.rn+"/"+current.rd+".";
    setTimeout(goNext,800);
  } else {
    bad++;
    updateStats();
    $("feedback").className="feedback bad";
    $("feedback").innerHTML="<b>Špatně ❌</b><br>Správný výsledek je <b>"+current.rn+"/"+current.rd+"</b>."
      +explanation()
      +'<div style="margin-top:14px"><button class="primary" id="continueBtn" type="button">Další příklad</button></div>';
    $("continueBtn").addEventListener("click",goNext);
  }
}

function goNext(){
  if(q>=TOTAL-1){
    finish();
    return;
  }
  q++;
  loadQuestion();
}

function showProcedure(){
  $("feedback").className="feedback info";
  $("feedback").innerHTML="<b>Postup:</b>"+explanation();
}

function skip(){
  if(!answered){
    answered=true;
    bad++;
    updateStats();
  }
  goNext();
}

function finish(){
  $("quiz").style.display="none";
  $("result").className="result show";
  $("progress").style.width="100%";

  const pct=Math.round(ok/TOTAL*100);
  $("scorePct").textContent=pct+" %";

  let verdict="";
  if(pct===100) verdict="Perfektní. Všech 10 správně.";
  else if(pct>=80) verdict="Výborně. Na test už to vypadá velmi dobře.";
  else if(pct>=60) verdict="Základ umíš. Dej si ještě jedno kolo.";
  else verdict="Ještě to procvič. U chyb si vždy projdi postup.";

  $("scoreText").textContent="Správně: "+ok+" z "+TOTAL+". "+verdict;
}

$("checkBtn").addEventListener("click",check);
$("showBtn").addEventListener("click",showProcedure);
$("nextBtn").addEventListener("click",skip);
$("restartBtn").addEventListener("click",newRound);

$("numInput").addEventListener("keydown",function(e){
  if(e.key==="Enter") $("denInput").focus();
});
$("denInput").addEventListener("keydown",function(e){
  if(e.key==="Enter") check();
});

newRound();
})();
</script>
